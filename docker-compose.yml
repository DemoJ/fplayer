services:
  fplayer:
    build: .
    container_name: fplayer
    ports:
      - "3000:3000"
    environment:
      # ⚠️ 该 APP_SECRET 是作者自用密钥，已随公开仓库公开，任何人拿到即可解密你保存的
      # WebDAV 账号密码。他人部署时务必替换为随机密钥：openssl rand -hex 32
      # （替换后需重新填写已保存的 WebDAV 密码。）
      APP_SECRET: c699a24b5bd628fb002cd2e1bc74bd1fae771f2bd5257c20e344ecfe6c9a3f5a
      DATA_DIR: /data
      # 登录会话可选配置（取消注释即可覆盖默认值；均为有限正数，可用小数）
      # SESSION_IDLE_DAYS: "30"                  # 闲置天数
      # SESSION_ABSOLUTE_DAYS: "90"              # 创建起绝对天数，仅新建/首次迁移时确定
      # SESSION_RENEW_INTERVAL_MINUTES: "60"    # 续期写库节流，须短于闲置天数折算的分钟数
      # 旧会话由原到期时间减30天回推创建时间；重启不重置寿命，过期/撤销不复活。
      # Use the host-mounted static ffmpeg/ffprobe (no per-build apt install).
      FFMPEG_PATH: /ffmpeg-static/ffmpeg
      FFPROBE_PATH: /ffmpeg-static/ffprobe
      TRANSCODE_ACCELERATION: auto
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: video,compute,utility
    gpus: all
    volumes:
      - ./data:/data
      - ./ffmpeg-static:/ffmpeg-static:ro
      # 容器现以非 root 用户(uid 1000)运行。若 data/ 目录是老版本(root 所有)产生的，
      # 首次升级需执行一次：sudo chown -R 1000:1000 data
      # 需要读取 NAS 本地媒体目录时，取消注释并把左侧改成实际路径
      # - /volume1/video:/media:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/setup').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
